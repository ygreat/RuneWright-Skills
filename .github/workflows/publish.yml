name: Publish to npm

# Publishes when a version tag is pushed, for example:
#   npm version patch   (or edit package.json) -> git tag v0.1.0 -> git push --tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Smoke test the CLI
        run: |
          node bin/runewright.js list
          node bin/runewright.js doctor

      - name: Check pack contents
        run: npm pack --dry-run

      - name: Publish
        run: |
          TAG_ARGS=""
          case "$GITHUB_REF_NAME" in
            *-*) TAG_ARGS="--tag next" ;;   # pre-releases (v1.0.0-beta.1) do not become "latest"
          esac
          npm publish --access public --provenance $TAG_ARGS
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
